# mamba env create -f environment.yml -p /ref/bmlab/software/envs/brb_pipeline
name: brb_pipeline
prefix: /ref/bmlab/software/envs/brb_pipeline
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.10
  - cutadapt=2.10
  - fastqc=0.12.1
  - star=2.7.6a
  - subread=2.0.2
  - rseqc=2.6.4
  - samtools=1.7
  - multiqc=1.13
  - pandas
